  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Install Android command line tools and SDK packages
    run: |
      sudo apt-get update
      sudo apt-get install -y wget unzip
      mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
      cd $ANDROID_SDK_ROOT
      wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
      unzip -q cmdline-tools.zip -d cmdline-tools
      mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
      mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
      yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  - name: Cache Gradle
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

  - name: Grant execute permission for Gradle wrapper
    run: chmod +x ./gradlew

  - name: Build Debug APK
    run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: app-debug.apk
      path: app/build/outputs/apk/debug/app-debug.apk
